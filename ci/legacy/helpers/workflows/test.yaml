name: Test
on:
  push:
    branches: [main]
    paths: ["fastfields/**", "tests/**", "pyproject.toml", ".github/workflows/test.yaml"]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    uses: fastfields/.github/.github/workflows/python-test.yml@main
    with:
      # This package depends on nothing -- no fastfields-dlpack, no compiled
      # extension, no array backend. Without this the shared workflow would
      # build the whole C++ chain on every runner in the matrix just to import
      # a handful of stdlib-only functions.
      needs-dlpack: false
    secrets: inherit

name: Test
on:
  push:
    branches: [main]
    paths: ["fastfields/**", "tests/**", "pyproject.toml", ".github/workflows/test.yaml"]
  pull_request:
permissions:
  contents: read
jobs:
  # This repo used to carry its own ~60-line copy of this job: a matrix, three
  # per-OS clang toolchain steps, and `git+https://...@main` installs of the
  # sibling wrapper repos, because `tests/test_auto.py` imports
  # fastfields.numpy and fastfields.torch and they lived elsewhere. All five
  # wrappers now ship from this repo, so the sibling installs are gone -- the
  # suites exercise each other's *source* rather than each other's last
  # release, which is the cross-repo version-skew window fastfields#3 was
  # opened about -- and what is left is identical to what numpy, torch, cupy
  # and helpers each called. So call it, instead of keeping a fifth copy.
  #
  # The matrix, the non-shallow checkout that versioningit needs, the clang
  # toolchain and the fastfields-dlpack install all live in the reusable
  # workflow. The array backends come from this distribution's `test` extra
  # (pytest + numpy + torch), which the reusable workflow's
  # `pip install ".[test]"` picks up; cupy is deliberately absent, so its
  # runtime tests skip and `import fastfields.cupy` is expected to refuse the
  # CPU-lane dlpack build (tests/test_cupy.py asserts exactly that).
  pytest:
    uses: fastfields/.github/.github/workflows/python-test.yml@main
    with:
      # Both axes are overridden here, for reasons that are about the runner
      # images rather than about this repo -- stated in full because an
      # unexplained matrix override is the kind of thing that gets "tidied"
      # back to the default:
      #
      # * macOS is dropped. The org's macOS runners did not pick these jobs
      #   up -- three legs sat queued and were cancelled after 15 minutes.
      #   It also buys the least here: this distribution is a single
      #   `py3-none-any` wheel with no compiled content, so the
      #   Python-version axis is the one that finds bugs. The platform axis
      #   matters for `fastfields-dlpack`, which is where the compiled
      #   artifacts live and where that leg belongs; its own release workflow
      #   already excludes macOS for a separate reason
      #   (fastfields-dlpack#8).
      # * The Python list starts at 3.10, which is this distribution's floor
      #   now that its hard dependency `fastfields-dlpack` ships one abi3
      #   wheel for CPython >= 3.10. A 3.9 leg would fail in pip's resolver
      #   rather than in a test. The leg used to be 3.9 and used to need
      #   `ubuntu-24.04` because `ubuntu-latest` (26.04) publishes no 3.9;
      #   3.10 through 3.12 are published for every current image, so 24.04
      #   is now a plain pin rather than a workaround.
      #
      # The shared default is a pair list covering 3.10-3.13 across four
      # Ubuntu images; whether this repo should just use it is a separate
      # call about which Pythons and platforms the project supports.
      os: '["ubuntu-24.04"]'
      python-versions: '["3.10", "3.11", "3.12"]'
    secrets: inherit

name: Test
on:
  push:
    branches: [main]
    paths: ["fastfields/**", "tests/**", "pyproject.toml", ".github/workflows/test.yaml"]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # windows red-by-design -> fastfields-dlpack#8
        python-version: ["3.9", "3.11", "3.12"]
    # The C++ build that fastfields-dlpack needs is driven by clang++ on every
    # OS; the per-OS steps below make sure a clang++ is on PATH.
    env:
      CXX: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # versioningit derives the version from `git describe`, which needs
          # the tags -- a shallow (depth 1) checkout hides them and the version
          # silently falls back to "0+unknown".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install build toolchain (macOS)
        if: runner.os == 'macOS'
        # clang++ ships with the Xcode Command Line Tools, already present on
        # the macOS runners, so there is nothing to install here.
        run: clang++ --version
      - name: Install build toolchain (Windows)
        if: runner.os == 'Windows'
        # The C++ Makefiles are now Windows-portable: clang++ builds a .dll
        # with no -fPIC/-soname, and the recipes run under git bash (shell:
        # bash). LLVM provides clang++; make drives the Makefiles. This leg was
        # red by design before that work landed; it may still need a live-CI
        # iteration on the first real Windows run (DLL-search / import-library
        # specifics can only be confirmed on the runner).
        run: choco install -y llvm make
      # pip *does* run `git submodule update --init --recursive` for a git+
      # install, so this works as long as the pinned submodule chain on
      # fastfields-dlpack@main is healthy. Once the wheel index carries a
      # release, prefer installing from there instead.
      - name: Install fastfields-dlpack from source
        run: pip install "fastfields-dlpack @ git+https://github.com/fastfields/fastfields-dlpack@main"
      - name: Install sibling wrapper packages (numpy, torch)
        # test_auto.py imports fastfields.numpy / fastfields.torch, so the meta
        # package needs the sibling wrappers installed. They resolve over public
        # HTTPS now that the submodule URLs are HTTPS (fastfields-lib#13). cupy is
        # not installed (needs a CUDA GPU); tests that need it should skip.
        run: |
          pip install "fastfields-numpy @ git+https://github.com/fastfields/fastfields-numpy@main"
          pip install "fastfields-torch @ git+https://github.com/fastfields/fastfields-torch@main"
      - name: Install package + test deps
        run: pip install ".[test]"
      - name: Run pytest
        run: cd /tmp && python -m pytest ${{ github.workspace }}/tests -q

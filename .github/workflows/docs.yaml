name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "fastfields/**"
      - "zensical.toml"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - ".github/workflows/docs.yaml"
  # The nav check below gates pull requests too -- that is the point of it, and
  # a menu that only breaks after merge is the situation this is here to end.
  # `build-deploy` stays push-only.
  #
  # The path list is repeated rather than shared with a YAML anchor: GitHub
  # Actions does not support anchors or aliases in workflow files.
  pull_request:
    paths:
      - "docs/**"
      - "fastfields/**"
      - "zensical.toml"
      - "tools/publish-docs.sh"
      - "tools/check-docs-nav.py"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # The top-level documentation menu is duplicated across four repositories --
  # zensical has no include mechanism -- and it drifted until no two sections
  # agreed on it. This job is the guard, and it has to run HERE, against THIS
  # repo's zensical.toml: a check living in only one repo cannot see another
  # repo's drift. The canonical list is in DOCS-THEME.md in fastfields/.github.
  nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # --selftest first: it checks the checker against known-good and
      # known-broken navs, so a check that has quietly stopped failing on
      # anything cannot pass for a working one.
      - run: python3 tools/check-docs-nav.py --selftest
      - run: python3 tools/check-docs-nav.py --check zensical.toml

  build-deploy:
    needs: nav
    # The nav check runs on pull requests; publishing does not.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Stops THIS repo racing itself. It is NOT the cross-repo guard: concurrency
    # groups are per-repository, so they cannot serialize this job against the
    # publishers in fastfields.github.io / fastfields-lib / fastfields-dlpack.
    # Those races are handled by the retry loop in tools/publish-docs.sh.
    # Scoped to this job rather than the workflow so a pull request's nav check
    # does not queue behind a publish.
    concurrency:
      group: publish-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          # versioningit derives the version from `git describe`, which needs
          # the tags; a shallow checkout hides them and the build below falls
          # back to "0+unknown".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r docs/requirements.txt
      # --no-deps, and this job has been RED ON MAIN since the helpers split
      # without it: a plain `pip install .` resolves this distribution's
      # dependency, which has never been on PyPI (it was fastfields-helpers,
      # it is now fastfields-dlpack), so the step fails with "No matching
      # distribution found" before zensical ever runs. Nothing here needs the
      # dependency: mkdocstrings reads the API statically with griffe -- it
      # parses `paths = ["."]` from zensical.toml and imports nothing -- so
      # the install exists only to run versioningit and write
      # fastfields/helpers/_version.py. Pulling fastfields-dlpack from the
      # wheel index would work too, but it would make the docs build wait on
      # a compiled wheel it does not read.
      - run: pip install --no-deps .
      - run: zensical build --clean

      # This section is served at fastfields.github.io/python/, which is a
      # subtree of the fastfields.github.io Pages site rather than a site of
      # its own -- the wanted path differs from this repo's name, so
      # actions/deploy-pages (which can only deploy to the repo it runs in)
      # cannot put it there. The script writes ONLY `python/` and cannot reach
      # the landing page or the other sections.
      #
      # Pushed over SSH as the DOCS_DEPLOY_KEY organization secret: the private
      # half of a deploy key registered on fastfields.github.io with write
      # access, scoped to this repo, fastfields-lib and fastfields-dlpack. The
      # default GITHUB_TOKEN cannot be used -- it is scoped to the repo it runs
      # in. The script checks the secret is non-empty before doing any work and
      # fails with one line naming it if not.
      - name: Publish the Python section into fastfields.github.io
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: ./tools/publish-docs.sh --auth ssh --subdir python --site site

[project]
site_name = "fastfields"
site_description = "The fastfields Python interface: numpy, torch, cupy and auto-dispatching wrappers over the fastfields.dlpack bindings."
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/python/"
repo_url = "https://github.com/fastfields/fastfields"
repo_name = "fastfields/fastfields"
copyright = "Copyright &copy; 2026 The fastfields authors"
# The shared theme. Served by the fastfields.github.io repo, referenced by
# absolute URL so the four sections look alike from one source -- and so no
# docs build has to fetch another repository.
extra_css = ["https://fastfields.github.io/stylesheets/extra.css"]
nav = [
  {"fastfields home" = "https://fastfields.github.io/"},
  {"Home" = "index.md"},
  {"Backends" = [
    "numpy.md",
    "torch.md",
    "cupy.md",
    "helpers.md",
  ]},
  {"Packaging" = "monorepo.md"},
  {"API" = [
    "api/index.md",
    "api/auto.md",
    "api/numpy.md",
    "api/torch.md",
    "api/cupy.md",
    "api/helpers.md",
  ]},
  {"Raw DLPack binding" = "https://fastfields.github.io/dlpack/"},
  {"C++/CUDA library" = "https://fastfields.github.io/lib/"},
  {"Wheel index" = "https://fastfields.github.io/whl/"},
]
[project.theme]
language = "en"
features = ["content.code.copy", "content.code.select", "navigation.indexes"]
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"
[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://pytorch.org/docs/stable/objects.inv",
  "https://docs.cupy.dev/en/stable/objects.inv",
]
paths = ["."]
[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
merge_init_into_class = true
separate_signature = true
members_order = "source"
show_root_heading = true
show_if_no_docstring = false
filters = "public"
show_signature_annotations = true
signature_crossrefs = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.toc]
toc_depth = 3

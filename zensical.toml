[project]
site_name = "fastfields"
site_description = "The fastfields Python interface: numpy, torch, cupy and auto-dispatching wrappers over the fastfields.dlpack bindings."
site_author = "Yaël Balbastre"
site_url = "https://fastfields.github.io/python/"
repo_url = "https://github.com/fastfields/fastfields"
repo_name = "fastfields/fastfields"
copyright = "Copyright &copy; 2026 The fastfields authors"
# The shared theme. Served by the fastfields.github.io repo, referenced by
# absolute URL so the four sections look alike from one source -- and so no
# docs build has to fetch another repository.
extra_css = ["https://fastfields.github.io/stylesheets/extra.css"]
# The canonical fastfields menu: one entry per installable fastfields
# namespace, plus Home and the wheel index. The eight top-level entries, these
# labels and this order are identical in all four sections (see DOCS-THEME.md
# in the fastfields/.github repo) and tools/check-docs-nav.py fails the build
# if they drift. A section expands the entries it owns into its own pages and
# links the rest absolutely: a relative target keeps in-site navigation native
# (active-page highlight, no full page reload), an absolute one crosses to
# another section's site.
#
# `fastfields.helpers` is not one of the eight: it ships inside the base
# distribution rather than being installed or imported on its own, so it is
# not a listed namespace. Its pages stay published, nested under
# `fastfields.auto` on the /python/ section.
#
# `index.md` leads the auto group on purpose. It is the Python section overview,
# and `navigation.indexes` therefore makes the `fastfields.auto` entry itself
# land on it -- a page whose opening paragraph is the auto-dispatch story. The
# API index and `monorepo.md` describe the distribution as a whole rather than
# one namespace, and the base distribution -- a plain `pip install fastfields`,
# which is exactly what ships `fastfields.auto` -- is where they belong.
nav = [
  {"Home" = "https://fastfields.github.io/"},
  {"fastfields.auto" = [
    "index.md",
    {"Overview" = "auto.md"},
    {"API reference" = "api/auto.md"},
    {"Shared arguments" = "helpers.md"},
    {"Shared arguments API" = "api/helpers.md"},
    {"All API pages" = "api/index.md"},
    {"Packaging" = "monorepo.md"},
  ]},
  {"fastfields.numpy" = [
    {"Overview" = "numpy.md"},
    {"API reference" = "api/numpy.md"},
  ]},
  {"fastfields.torch" = [
    {"Overview" = "torch.md"},
    {"API reference" = "api/torch.md"},
  ]},
  {"fastfields.cupy" = [
    {"Overview" = "cupy.md"},
    {"API reference" = "api/cupy.md"},
  ]},
  {"fastfields.dlpack" = "https://fastfields.github.io/dlpack/"},
  {"libfastfields" = "https://fastfields.github.io/lib/"},
  {"Wheel index" = "https://fastfields.github.io/whl/"},
]
[project.theme]
language = "en"
features = ["content.code.copy", "content.code.select", "navigation.indexes"]
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
[project.theme.icon]
logo = "fontawesome/solid/spiral"
repo = "fontawesome/brands/github"
[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://pytorch.org/docs/stable/objects.inv",
  "https://docs.cupy.dev/en/stable/objects.inv",
]
paths = ["."]
[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
merge_init_into_class = true
separate_signature = true
members_order = "source"
show_root_heading = true
show_if_no_docstring = false
filters = "public"
show_signature_annotations = true
signature_crossrefs = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.toc]
toc_depth = 3

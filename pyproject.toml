[build-system]
requires = ["setuptools>=61.0", "versioningit>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields"
description = "The fastfields Python interface: numpy, torch, cupy and auto-dispatching wrappers over the fastfields.dlpack bindings."
readme = "README.md"
# Tracks the floor of the hard dependency below. `fastfields-dlpack` is
# `requires-python = ">=3.10"` since its extension became a single abi3
# wheel (nanobind split mode, whose limited API cannot go below 3.10).
# This distribution is pure Python and would run on 3.9, but claiming
# ">=3.9" while hard-depending on a package that does not exist for 3.9
# only moves the failure from a clear "requires a different Python" into
# pip's resolver.
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]
authors = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
maintainers = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
keywords = ["fastfields", "medical-imaging", "interpolation", "distance-transform", "gpu", "dlpack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# This distribution ships five PEP 420 subpackages of the `fastfields`
# namespace -- fastfields.{helpers,numpy,cupy,torch,auto} -- and is itself
# pure Python (py3-none-any, no compiled content). It used to be five separate
# distributions; see docs/monorepo.md for what the merge did and did not
# change.
#
# `fastfields-dlpack` -- the compiled nanobind bindings, which stay a separate
# distribution and a separate repo because they need a per-platform wheel
# matrix -- is the only hard dependency. A pure-Python fix still ships as an
# ordinary universal wheel of *this* distribution with no recompilation
# anywhere, which is the property `fastfields-helpers` was originally split out
# to get, and the reason dlpack is not folded in here.
#
# The requirement is DELIBERATELY UNQUALIFIED with respect to the compute
# backend. fastfields-dlpack encodes its backend in the PEP 440 *local*
# segment, PyTorch-style (`0.0.dev0+cpu`, `+cu118`, `+cu126`, `+cu130`), and
# which lane you get is decided by the index folder you install from, not by
# the dependency graph -- pip cannot express "any build with CUDA", and a pin
# here would fight the user's `--extra-index-url` choice. Each namespace
# enforces its own backend requirement at runtime instead: see
# fastfields/cupy/__init__.py (fails at import on a non-CUDA build) and
# fastfields/torch/_util.py (fails only when a CUDA tensor meets a CPU-only
# build).
#
# `==0.*` is a bare wildcard, not a range: it allows any 0.x.y -- including
# 0.0.x and any dev/alpha/beta/rc, e.g. `0.1.0.dev1` or `0.0.dev0` -- while
# still blocking a future 1.x whose ABI/enums no longer match. It says nothing
# about the local segment, so every lane satisfies it.
#
# Accepted risk: versioningit's `default-version = "0+unknown"` fallback
# (fires when `git describe` can't find a tag, e.g. a shallow-clone CI
# misconfiguration) would also satisfy `==0.*` if it were ever accidentally
# published. That's an accepted risk, not something this pin tries to solve.
dependencies = ["fastfields-dlpack==0.*"]

# The array libraries are extras, so `pip install fastfields` works with
# whatever subset of numpy/torch/cupy you have, and `fastfields.auto`
# dispatches over exactly that subset.
#
# NOTE, and this is the one genuinely awkward consequence of folding the
# wrappers together: AN EXTRA SELECTS THE CLIENT LIBRARY, NOT THE WHEEL LANE.
# `pip install fastfields[cupy]` installs cupy and resolves perfectly happily
# against a `+cpu` fastfields-dlpack, and then `import fastfields.cupy` fails
# -- because a CUDA client on top of CPU-only compiled kernels cannot work.
# That is not fixable in metadata (see the unqualified-dependency note above);
# the import-time error message is what makes it acceptable, and it names both
# the CUDA index URL and the command to fix it. Documented in docs/monorepo.md.
[project.optional-dependencies]
numpy = ["numpy"]
torch = ["torch"]
# Pulls a prebuilt CUDA 12.x cupy wheel. Pick the build matching your CUDA
# toolkit (e.g. cupy-cuda11x) if 12.x is not appropriate. cupy is deliberately
# not a hard dependency for exactly that reason: the correct wheel depends on
# the host CUDA version.
cupy = ["cupy-cuda12x"]
all = ["numpy", "torch", "cupy-cuda12x"]
# numpy is needed by more than its own suite: the torch and cupy suites build
# reference arrays with it, and the cupy suite feeds the wrappers through the
# array protocol. cupy itself is not a test dependency -- its runtime tests are
# GPU-gated and skip without a device.
test = ["pytest", "numpy", "torch"]

# Ships the five ``fastfields.*`` subpackages and -- crucially -- NO
# ``fastfields/__init__.py``. That absence is what keeps ``fastfields`` a PEP
# 420 native namespace package, so this distribution merges at import time with
# ``fastfields.dlpack`` from the separately-released fastfields-dlpack wheel.
# Creating a top-level ``__init__.py`` here would turn ``fastfields`` into a
# regular package and make ``fastfields.dlpack`` unimportable. `namespaces =
# true` is what lets setuptools find subpackages that have no parent
# ``__init__.py``; without it this find directive returns nothing at all.
[tool.setuptools.packages.find]
include = [
    "fastfields.helpers*",
    "fastfields.numpy*",
    "fastfields.cupy*",
    "fastfields.torch*",
    "fastfields.auto*",
]
namespaces = true

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[project.urls]
Homepage = "https://github.com/fastfields/fastfields"
Documentation = "https://fastfields.github.io/fastfields/"
Issues = "https://github.com/fastfields/fastfields/issues"
Repository = "https://github.com/fastfields/fastfields"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

# One distribution, one version. The five merged packages each used to carry
# their own versioningit `write` target; versioningit writes exactly one file,
# so the merged distribution needs a single home for it.
#
# It is ``fastfields/helpers/_version.py`` because helpers is the bottom of
# this distribution's internal stack -- numpy, cupy, torch and auto all import
# fastfields.helpers, and it imports none of them. Putting it in any of the
# other four would make reading the version import that subpackage (and, for
# the three array wrappers, their array library), and putting it in `auto`
# specifically would be circular: `fastfields.auto` imports
# `fastfields.helpers`, so `fastfields.helpers` cannot reach into
# `fastfields.auto` to find its own version.
#
# `fastfields.{helpers,numpy,cupy,torch,auto}.__version__` all resolve to this
# one string; `fastfields.dlpack.__version__` belongs to a separate
# distribution and may legitimately differ.
[tool.versioningit.write]
file = "fastfields/helpers/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "fastfields.helpers",
    "fastfields.numpy",
    "fastfields.cupy",
    "fastfields.torch",
    "fastfields.auto",
]
omit = ["*/_version.py"]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,docs/examples"
ignore-words-list = "ot"

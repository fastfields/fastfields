[build-system]
requires = ["setuptools>=61.0", "versioningit>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields"
description = "Backend-dispatching interface (fastfields.any) over the fastfields wrappers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
authors = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
maintainers = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
keywords = ["fastfields", "medical-imaging", "interpolation", "distance-transform", "gpu", "dlpack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Only the raw bindings are a hard dependency (needed for the shared enums and
# for dispatch to work at all). The array backends are optional extras so that
# `fastfields.any` works with whatever subset of numpy/torch/cupy is installed.
# `>=0.1.dev0,==0.*` is `~=0.1` with the floor lowered to include pre-releases:
# the fastfields distributions are versioned and released together off the
# same 0.1 line (versioningit `default-tag = "0.1"`), so a bare, unversioned
# dependency would happily resolve to a future 1.x whose ABI/enums no longer
# match this wrapper. The floor is deliberately the line, not an exact pin, so
# in-development builds (`0.1+<distance>.g<rev>`, and the backend-labelled
# release wheels `0.1+cpu` / `0.1+cu128`) all satisfy it and the constraint
# does not go stale on every commit. Plain `~=0.1` expands to `>=0.1, ==0.*`,
# and `>=0.1` rejects every dev/alpha/beta/rc of 0.1.0 (pre-releases always
# sort below the final release with the same number under PEP 440) — which
# would make it impossible to depend on the very first published (dev/alpha)
# tag. `0.1.dev0` sorts below all of those, so `>=0.1.dev0` admits them while
# `==0.*` keeps the same upper bound.
dependencies = ["fastfields-dlpack>=0.1.dev0,==0.*"]

# The sibling wrappers move on the same 0.1 line and are constrained the same
# way as fastfields-dlpack above.
[project.optional-dependencies]
numpy = ["fastfields-numpy>=0.1.dev0,==0.*"]
torch = ["fastfields-torch>=0.1.dev0,==0.*"]
cupy = ["fastfields-cupy>=0.1.dev0,==0.*"]
all = ["fastfields-numpy>=0.1.dev0,==0.*", "fastfields-torch>=0.1.dev0,==0.*", "fastfields-cupy>=0.1.dev0,==0.*"]
test = ["pytest", "numpy"]

# Ships only the ``fastfields.any`` subpackage; no ``fastfields/__init__.py`` is
# created, keeping ``fastfields`` a PEP 420 native namespace package that merges
# with fastfields.dlpack / .numpy / .torch / .cupy.
[tool.setuptools.packages.find]
include = ["fastfields.any*"]
namespaces = true

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[project.urls]
Homepage = "https://github.com/fastfields/fastfields"
Documentation = "https://fastfields.github.io/fastfields/"
Issues = "https://github.com/fastfields/fastfields/issues"
Repository = "https://github.com/fastfields/fastfields"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "fastfields/any/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastfields.any"]
omit = ["*/_version.py"]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,docs/examples"
ignore-words-list = "ot"

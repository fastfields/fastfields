[build-system]
requires = ["setuptools>=61.0", "versioningit>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields"
description = "Backend-dispatching interface (fastfields.any) over the fastfields wrappers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
authors = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
maintainers = [{ name = "Yaël Balbastre", email = "yael.bx@gmail.com" }]
keywords = ["fastfields", "medical-imaging", "interpolation", "distance-transform", "gpu", "dlpack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Only the raw bindings are a hard dependency (needed for the shared enums and
# for dispatch to work at all). The array backends are optional extras so that
# `fastfields.any` works with whatever subset of numpy/torch/cupy is installed.
# `==0.*` is a bare wildcard, not a range: it allows any 0.x.y — including
# 0.0.x and any dev/alpha/beta/rc, e.g. `0.1.0.dev1` or `0.0.dev0` — while
# still blocking a future 1.x whose ABI/enums no longer match this wrapper.
# The fastfields distributions are versioned and released together off the
# same 0.x line (versioningit `default-tag = "0.1"`), so the upper bound is
# the only bound doing real work here. This is the first release of these
# packages, so there is no earlier version to guard against with a floor —
# an earlier fix pinned `>=0.1.dev0` to admit 0.1.0 pre-releases, but that
# floor was protecting against nothing real and has been dropped for a
# simpler bare wildcard.
#
# Accepted risk: versioningit's `default-version = "0+unknown"` fallback
# (fires when `git describe` can't find a tag, e.g. a shallow-clone CI
# misconfiguration) would also satisfy `==0.*` if it were ever accidentally
# published. That's an accepted risk, not something this pin tries to solve.
dependencies = ["fastfields-dlpack==0.*"]

# The sibling wrappers move on the same 0.x line and are constrained the same
# bare-wildcard way as fastfields-dlpack above.
[project.optional-dependencies]
numpy = ["fastfields-numpy==0.*"]
torch = ["fastfields-torch==0.*"]
cupy = ["fastfields-cupy==0.*"]
all = ["fastfields-numpy==0.*", "fastfields-torch==0.*", "fastfields-cupy==0.*"]
test = ["pytest", "numpy"]

# Ships only the ``fastfields.any`` subpackage; no ``fastfields/__init__.py`` is
# created, keeping ``fastfields`` a PEP 420 native namespace package that merges
# with fastfields.dlpack / .numpy / .torch / .cupy.
[tool.setuptools.packages.find]
include = ["fastfields.any*"]
namespaces = true

[tool.ruff]
line-length = 79
extend-exclude = ["docs/examples"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = [
    "B905",   # zip(strict=...) requires Python >= 3.10
    "B007",   # allow unused loop variables
    "E731",   # allow assigning lambdas to variables
]

[project.urls]
Homepage = "https://github.com/fastfields/fastfields"
Documentation = "https://fastfields.github.io/fastfields/"
Issues = "https://github.com/fastfields/fastfields/issues"
Repository = "https://github.com/fastfields/fastfields"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.vcs]
default-tag = "0.1"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "fastfields/any/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastfields.any"]
omit = ["*/_version.py"]

[tool.codespell]
check-filenames = true
skip = ".git,*.egg-info,build,dist,*.pdf,*.svg,docs/examples"
ignore-words-list = "ot"
